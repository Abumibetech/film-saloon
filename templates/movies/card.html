<article class="movie-card"><a class="poster" href="{% url 'movie_detail' movie.slug %}">{% if movie.poster %}<img src="{{ movie.poster.url }}" alt="{{ movie.title }}" loading="lazy">{% else %}<div class="poster-placeholder">🎬</div>{% endif %}<span class="genre-pill">{{ movie.get_genre_display }}</span></a><div class="movie-content"><h3><a href="{% url 'movie_detail' movie.slug %}">{{ movie.title }}</a></h3><p>{{ movie.description|truncatewords:17 }}</p><div class="movie-actions"><a class="outline-btn" href="{% url 'movie_detail' movie.slug %}">Details</a>{% if movie.external_link %}<a class="outline-btn" href="{{ movie.external_link }}" target="_blank" rel="noopener">Watch ↗</a>{% endif %}</div><div class="reaction-summary">♥ {{ movie.likes }} · ♡ {{ movie.dislikes }} · 👁 {{ movie.views }}</div></div></article>
